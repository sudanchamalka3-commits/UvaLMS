<!DOCTYPE html>
<html lang="si" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ICTPLUZ Interactive Smart Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Sinhala:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: rgba(79, 70, 229, 0.15);
  --accent: #06b6d4;
  --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
  --card-bg: rgba(30, 41, 59, 0.7);
  --card-border: rgba(255, 255, 255, 0.1);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --input-bg: rgba(15, 23, 42, 0.6);
  --border-color: rgba(255, 255, 255, 0.15);
  --ok: #10b981;
  --bad: #ef4444;
  --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
  --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}

[data-theme="light"] {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: rgba(79, 70, 229, 0.1);
  --accent: #0891b2;
  --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 50%, #f1f5f9 100%);
  --card-bg: rgba(255, 255, 255, 0.85);
  --card-border: rgba(0, 0, 0, 0.08);
  --text-main: #0f172a;
  --text-muted: #64748b;
  --input-bg: rgba(255, 255, 255, 0.9);
  --border-color: rgba(0, 0, 0, 0.12);
  --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
}

* { box-sizing: border-box; transition: background 0.3s, border-color 0.3s; }
body {
  margin: 0;
  font-family: 'Plus Jakarta Sans', 'Noto Sans Sinhala', sans-serif;
  background: var(--bg-gradient);
  background-attachment: fixed;
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  background: rgba(15, 23, 42, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  padding: 14px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand-title { font-weight: 800; font-size: 1.25rem; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

.header-controls { display: flex; align-items: center; gap: 12px; }
.theme-toggle { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 50%; width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }

#net { font-size: 0.75rem; font-weight: 700; padding: 4px 12px; border-radius: 99px; background: var(--bad); color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
#net.on { background: var(--ok); }

.v { max-width: 1000px; margin: 24px auto; padding: 0 16px; width: 100%; flex: 1; }
.card {
  background: var(--card-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--card-border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
  animation: fadeIn 0.4s ease-out;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

h3 { margin: 0 0 16px; font-weight: 700; font-size: 1.2rem; color: var(--text-main); }
input, select, button {
  font-family: inherit;
  font-size: 0.95rem;
  padding: 12px 16px;
  border-radius: 10px;
  border: 1px solid var(--border-color);
  width: 100%;
  margin: 6px 0;
  background: var(--input-bg);
  color: var(--text-main);
}
input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
button {
  background: var(--primary);
  color: #fff;
  border: none;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
}
button:hover { background: var(--primary-hover); transform: translateY(-1px); }
button:active { transform: translateY(0); }
button.r { background: var(--bad); }
button.g2 { background: rgba(148, 163, 184, 0.2); color: var(--text-main); }
button.o { background: var(--input-bg); color: var(--text-main); border: 1px solid var(--border-color); text-align: left; }
button.o.sel { border: 2px solid var(--primary); background: var(--primary-light); }

.g { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
@media(max-width:768px){ .g { grid-template-columns: 1fr; } }
.row { display: flex; gap: 10px; } .row button { margin: 6px 0; }

video { width: 100%; background: #000; border-radius: 12px; max-height: 50vh; object-fit: contain; }
.code { font-size: 2.2rem; letter-spacing: 6px; font-weight: 800; color: var(--accent); font-family: monospace; }

.bar-wrapper { margin: 10px 0; }
.bar-label { display: flex; justify-content: space-between; font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
.bar { background: var(--input-bg); border-radius: 8px; overflow: hidden; height: 12px; border: 1px solid var(--border-color); }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); border-radius: 8px; transition: width 0.5s ease-out; }

#qr { display: flex; justify-content: center; padding: 12px; }
#jb {
  position: sticky; top: 65px; z-index: 40;
  background: var(--card-bg); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  display: flex; gap: 16px; align-items: center; justify-content: center;
